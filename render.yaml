services:
  - type: web
    name: aeon-bot
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: aeon-db
          property: connectionString
      - key: NODE_ENV
        value: production

databases:
  - name: aeon-db
    databaseName: aeon
    plan: free
